services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: irrigacao_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - db
    environment:
      PORT: 8080
      JWT_SECRET: cole_aqui_um_segredo_forte
      DATABASE_URL: postgres://postgres:postgres@db:5432/irrigacao_db
    ports:
      - "8080:8080"

volumes:
  pgdata:

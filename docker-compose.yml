version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: irrigacao_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-irrigacao_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web/back/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-irrigacao_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./web/back
      dockerfile: Dockerfile
    container_name: irrigacao_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/${POSTGRES_DB:-irrigacao_db}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      NODE_ENV: ${NODE_ENV:-development}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
